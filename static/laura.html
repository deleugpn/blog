<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução laboratorial — Laura Ferreira Deleu</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#f5f6f4; --surface:#ffffff; --surface-2:#eef0ec; --border:#dfe2dc; --border-2:#c3c7bf;
    --text:#17191c; --text-2:#52565c; --text-3:#8a8f96;
    --low:#1f4fb8; --low-bg:#dee8ff; --low-bg-2:#b9ceff;
    --high:#b4281c; --high-bg:#fde2df; --high-bg-2:#f9b9b2;
    --ok:#1f7a48; --ok-bg:#e4f3e9;
    --band:rgba(31,122,72,.17); --line:#2b2e33; --grid:#e3e6e0;
    --accent:#116b78; --focus:#116b78;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#131416; --surface:#1b1d20; --surface-2:#24272b; --border:#2e3136; --border-2:#434750;
      --text:#e9eae6; --text-2:#a7aaa5; --text-3:#767a78;
      --low:#9db9ff; --low-bg:rgba(70,115,230,.22); --low-bg-2:rgba(70,115,230,.45);
      --high:#ff9d93; --high-bg:rgba(230,75,60,.22); --high-bg-2:rgba(230,75,60,.46);
      --ok:#73d69b; --ok-bg:rgba(60,170,100,.18);
      --band:rgba(90,205,130,.17); --line:#e9eae6; --grid:#2e3136;
      --accent:#5fd0d8; --focus:#5fd0d8;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#131416; --surface:#1b1d20; --surface-2:#24272b; --border:#2e3136; --border-2:#434750;
    --text:#e9eae6; --text-2:#a7aaa5; --text-3:#767a78;
    --low:#9db9ff; --low-bg:rgba(70,115,230,.22); --low-bg-2:rgba(70,115,230,.45);
    --high:#ff9d93; --high-bg:rgba(230,75,60,.22); --high-bg-2:rgba(230,75,60,.46);
    --ok:#73d69b; --ok-bg:rgba(60,170,100,.18);
    --band:rgba(90,205,130,.17); --line:#e9eae6; --grid:#2e3136;
    --accent:#5fd0d8; --focus:#5fd0d8;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{background:var(--bg);color:var(--text);font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .echip{display:inline-flex;align-items:baseline;gap:.35em;padding:3px 9px;border:1px solid var(--border-2);border-radius:999px;color:var(--text-2);background:var(--surface)}
  .echip.cur{color:var(--text);border-color:var(--text-2)}
  .echip b{font-weight:600;color:var(--text)}
  .echip-sep{color:var(--text-3);align-self:center}

  .chip{display:inline-flex;align-items:baseline;gap:.4em;padding:4px 10px;border-radius:8px;font-size:13px;border:1px solid transparent;cursor:pointer;text-align:left;line-height:1.25}
  .chip b{font-weight:700}
  .chip.low{background:var(--low-bg);color:var(--low)} .chip.low.s2{background:var(--low-bg-2)}
  .chip.high,.chip.alt{background:var(--high-bg);color:var(--high)} .chip.high.s2{background:var(--high-bg-2)}
  .chip .cs{font-size:11px;opacity:.75}
  .chip:hover{border-color:currentColor}
  .empty{color:var(--text-3);font-size:13px}

  .btn{border:1px solid var(--border-2);background:var(--surface);color:var(--text);padding:4px 10px;border-radius:8px;font-size:13px;line-height:1.3}
  .btn:hover{background:var(--surface-2)}
  input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2)}
  .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

  .panel{margin-bottom:26px}
  .panel h2{font-size:15px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
  .panel .ptoggle{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .panel .ptoggle::before{content:"▾";font-size:12px;color:var(--text-3);transition:transform .15s}
  .panel.collapsed .ptoggle::before{transform:rotate(-90deg)}
  .panel .pmeta{font-weight:400;font-size:12px;color:var(--text-3);margin-left:4px}
  .panel .nota{font-size:12px;color:var(--text-3);margin:0 0 8px}
  .panel.collapsed .nota,.panel.collapsed .tbl-wrap{display:none}
  .tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);-webkit-overflow-scrolling:touch}
  table.flow{border-collapse:separate;border-spacing:0;width:100%;min-width:680px;font-size:13px}
  .flow th,.flow td{padding:6px 9px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  .flow tbody tr:last-child td{border-bottom:0}
  .flow thead th{font-weight:500;color:var(--text-2);font-size:12px;background:var(--surface-2);text-align:right;line-height:1.2;vertical-align:top}
  .flow thead th .h2{display:block;font-size:11px;color:var(--text-3);font-weight:400}
  .flow thead th.cur{color:var(--text);font-weight:600}
  .flow thead th.c-an,.flow thead th.c-t,.flow thead th.c-r{text-align:left}
  .flow th.c-an,.flow td.c-an{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:150px;max-width:210px;white-space:normal;box-shadow:1px 0 0 var(--border)}
  .flow thead th.c-an{background:var(--surface-2);z-index:2}
  .an-nome{display:block;font-weight:500;line-height:1.2}
  .an-un{display:block;font-size:11px;color:var(--text-3);line-height:1.2;margin-top:1px}
  .flow td.c-v{text-align:right;min-width:76px}
  .flow td.c-v.cur{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
  .flow td.c-t{min-width:150px;padding-top:3px;padding-bottom:3px}
  .flow td.c-r{color:var(--text-2);font-size:12px;min-width:118px;white-space:normal;max-width:220px}
  .flow tbody tr.row{cursor:pointer}
  .flow tbody tr.row:hover td.c-an{background:var(--surface-2)}
  .flow tbody tr.row td.c-an::after{content:"›";float:right;color:var(--text-3);margin-left:6px;transition:transform .15s}
  .flow tbody tr.row.open td.c-an::after{transform:rotate(90deg)}
  .v{display:inline-block;padding:2px 6px;border-radius:6px;line-height:1.25}
  .v.low{color:var(--low);background:var(--low-bg)} .v.low.s2{background:var(--low-bg-2);font-weight:700}
  .v.high{color:var(--high);background:var(--high-bg)} .v.high.s2{background:var(--high-bg-2);font-weight:700}
  .v.alt{color:var(--high);background:var(--high-bg);font-weight:600}
  .v.none{color:var(--text-3)} .v.na{color:var(--text)}
  .v .arr{font-size:11px;margin-left:1px}
  .sub{display:block;font-size:10.5px;color:var(--text-3);line-height:1.15;margin-top:3px;padding-right:6px}
  .refchg{color:var(--accent);cursor:help}

  .spark{display:block}
  .band{fill:var(--band)}
  .spark-line{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
  .dot.low{fill:var(--low)} .dot.high{fill:var(--high)} .dot.ok{fill:var(--ok)} .dot.na{fill:var(--text-3)}
  .dot{stroke:var(--surface);stroke-width:1.2}
  tr.detail{display:none} tr.detail.open{display:table-row}
  tr.detail>td{background:var(--surface-2);padding:10px 12px 12px;white-space:normal}
  .detail-in{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
  @media (min-width:900px){.detail-in{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}}
  .chart{width:100%;height:auto;max-height:230px;display:block}
  .chart .grid{stroke:var(--grid);stroke-width:1}
  .chart .tick{font-size:11px;fill:var(--text-3)}
  .chart .xl{font-size:11.5px;fill:var(--text);font-weight:500} .chart .xl2{font-size:10.5px;fill:var(--text-3)}
  .chart .dim{opacity:.45}
  .chart .vl{font-size:12px;font-weight:600;fill:var(--text)} .chart .vl.low{fill:var(--low)} .chart .vl.high{fill:var(--high)}
  .chart .chart-line{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linejoin:round}
  .dl{list-style:none;margin:0;padding:0;font-size:13px}
  .dl li{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--border)}
  .dl li:last-child{border-bottom:0}
  .dl .dl-d{color:var(--text-2);white-space:nowrap}
  .dl .dl-r{grid-column:1/-1;font-size:12px;color:var(--text-3)}
  .dl .dl-l{font-size:12px;color:var(--text-3);text-align:right}

  .only-alt tr.row:not(.alt){display:none}
  .only-alt tr.row:not(.alt)+tr.detail{display:none}
  .only-alt .panel.no-alt{display:none}

  @media (max-width:640px){
    table.flow{font-size:12.5px;min-width:640px}
    .flow th,.flow td{padding:5px 7px}
    .flow th.c-an,.flow td.c-an{min-width:128px;max-width:150px}
    .flow td.c-v{min-width:66px}
    .flow td.c-t{min-width:128px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media print{
    :root{--bg:#fff}
    .no-print{display:none!important}
    body{font-size:11px}
    .tbl-wrap{overflow:visible;border-radius:0}
    table.flow{min-width:0;font-size:11px}
    .flow th,.flow td{padding:3px 6px}
    .panel{break-inside:avoid}
    .panel.collapsed .nota,.panel.collapsed .tbl-wrap{display:block}
    tr.detail.open{display:table-row}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>

/* ========================= lógica ========================= */
const LAST = EXAMES[EXAMES.length-1].id;
const nf = {};
function fmt(n, dec){
  if (n == null) return "—";
  if (typeof n !== "number") return String(n);
  const k = dec|0;
  if (!nf[k]) nf[k] = new Intl.NumberFormat("pt-BR", {minimumFractionDigits:k, maximumFractionDigits:k});
  return nf[k].format(n).replace("-", "−");
}
function ponto(an, exId){
  let e = an.valores[exId];
  if (e === undefined) return {v:null, ref:an.ref, dec:an.dec};
  if (typeof e !== "object" || e === null) e = {v:e};
  return {v:e.v, pct:e.pct, ref:(e.ref !== undefined ? e.ref : an.ref), dec:(e.dec != null ? e.dec : an.dec), nota:e.nota, hora:e.hora};
}
function pontos(an){
  return EXAMES.map((ex,i)=>Object.assign(ponto(an, ex.id), {ex, i, t:Date.parse(ex.ts)}));
}
function status(v, ref){
  if (v == null) return "none";
  if (!ref) return "na";
  if (ref.texto !== undefined) return String(v).trim().toLowerCase() === ref.texto.trim().toLowerCase() ? "ok" : "alt";
  if (typeof v !== "number") return "na";
  if (ref.min != null && v < ref.min) return "low";
  if (ref.max != null && v > ref.max) return "high";
  return "ok";
}
const ABN = s => s === "low" || s === "high" || s === "alt";
function dist(v, ref){
  const s = status(v, ref);
  if (s === "alt") return 1;
  if (s !== "low" && s !== "high") return 0;
  const w = (ref.min != null && ref.max != null) ? (ref.max - ref.min) : Math.abs(ref.max != null ? ref.max : ref.min);
  const ww = w > 0 ? w : 1;
  return (s === "low" ? ref.min - v : v - ref.max) / ww;
}
function sev(v, ref){ const d = dist(v, ref); return d === 0 ? 0 : (d >= 0.5 ? 2 : 1); }
function refTexto(ref, an, comUnidade, dec){
  if (!ref) return "—";
  if (ref.texto !== undefined) return ref.texto;
  const d = dec != null ? dec : an.dec;
  const u = (comUnidade && an.unidade) ? " " + an.unidade : "";
  if (ref.rotulo) return ref.rotulo + u;
  const f = n => fmt(n, d);
  if (ref.min != null && ref.max != null) return `${f(ref.min)} a ${f(ref.max)}${u}`;
  if (ref.max != null) return `≤ ${f(ref.max)}${u}`;
  if (ref.min != null) return `≥ ${f(ref.min)}${u}`;
  return "—";
}
function dominio(pts){
  let lo = Infinity, hi = -Infinity;
  const add = x => { if (typeof x === "number" && isFinite(x)) { lo = Math.min(lo, x); hi = Math.max(hi, x); } };
  pts.forEach(p => { add(p.v); if (p.ref && p.ref.texto === undefined) { add(p.ref.min); add(p.ref.max); } });
  if (!isFinite(lo)) return null;
  if (hi === lo) { const e = Math.abs(lo) * 0.1 || 1; lo -= e; hi += e; }
  const pad = (hi - lo) * 0.15;
  return [lo - pad, hi + pad];
}
function niceTicks(lo, hi, n){
  const raw = (hi - lo) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return {ticks: out, dec: Math.max(0, -Math.floor(Math.log10(step) + 1e-9))};
}
function pctTxt(pct){ return fmt(pct, pct % 1 ? 1 : 0) + " %"; }
function horaDe(p){ return p.hora || p.ex.horaPadrao || p.ex.hora; }

/* ======================== render ======================== */
function cellHtml(an, p){
  if (p.v == null) return `<span class="v none">—</span>`;
  const s = status(p.v, p.ref), sv = sev(p.v, p.ref);
  const arr = s === "low" ? `<span class="arr">↓</span>` : s === "high" ? `<span class="arr">↑</span>` : "";
  const subs = [p.pct != null ? pctTxt(p.pct) : null, p.nota].filter(Boolean).map(t => `<span class="sub">${t}</span>`).join("");
  return `<span class="v ${s} s${sv}" title="Ref. ${refTexto(p.ref, an, true, p.dec)}">${fmt(p.v, p.dec)}${arr}</span>${subs}`;
}
function sparkline(an, pts){
  const dom = dominio(pts); if (!dom) return "";
  const W = 150, H = 36, px = 9, py = 5, n = pts.length, [lo, hi] = dom;
  const xs = i => n === 1 ? W/2 : px + i * (W - 2*px) / (n - 1);
  const ys = v => H - py - (v - lo) / (hi - lo) * (H - 2*py);
  let band = "";
  pts.forEach((p, i) => {
    const r = p.ref; if (!r || r.texto !== undefined) return;
    const x0 = i === 0 ? 0 : (xs(i-1) + xs(i)) / 2, x1 = i === n-1 ? W : (xs(i) + xs(i+1)) / 2;
    const top = r.max != null ? ys(r.max) : 0, bot = r.min != null ? ys(r.min) : H;
    band += `<rect x="${x0.toFixed(1)}" y="${top.toFixed(1)}" width="${(x1-x0).toFixed(1)}" height="${Math.max(1.5, bot-top).toFixed(1)}" class="band"/>`;
  });
  const num = pts.filter(p => typeof p.v === "number");
  const path = num.length > 1 ? `<path class="spark-line" d="${num.map((p,k)=>`${k?"L":"M"}${xs(p.i).toFixed(1)} ${ys(p.v).toFixed(1)}`).join(" ")}"/>` : "";
  const dots = num.map(p => `<circle cx="${xs(p.i).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3" class="dot ${status(p.v, p.ref)}"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" class="spark" aria-hidden="true">${band}${path}${dots}</svg>`;
}
function chartBig(an, pts){
  const dom = dominio(pts); if (!dom) return "";
  const W = 640, H = 210, ml = 56, mr = 20, mt = 24, mb = 38, n = pts.length, [lo, hi] = dom;
  const t0 = Math.min(...pts.map(p=>p.t)), t1 = Math.max(...pts.map(p=>p.t)), span = (t1 - t0) || 1;
  const xs = p => n === 1 ? ml + (W-ml-mr)/2 : ml + (p.t - t0) / span * (W - ml - mr);
  const ys = v => H - mb - (v - lo) / (hi - lo) * (H - mt - mb);
  const {ticks, dec} = niceTicks(lo, hi, 4);
  const grid = ticks.map(t => `<line x1="${ml}" x2="${W-mr}" y1="${ys(t).toFixed(1)}" y2="${ys(t).toFixed(1)}" class="grid"/><text x="${ml-8}" y="${(ys(t)+3.5).toFixed(1)}" text-anchor="end" class="tick">${fmt(t, dec)}</text>`).join("");
  let band = "";
  pts.forEach((p, i) => {
    const r = p.ref; if (!r || r.texto !== undefined) return;
    const x0 = i === 0 ? ml : (xs(pts[i-1]) + xs(p)) / 2, x1 = i === n-1 ? W-mr : (xs(p) + xs(pts[i+1])) / 2;
    const top = r.max != null ? ys(r.max) : mt, bot = r.min != null ? ys(r.min) : H - mb;
    band += `<rect x="${x0.toFixed(1)}" y="${top.toFixed(1)}" width="${(x1-x0).toFixed(1)}" height="${Math.max(1.5, bot-top).toFixed(1)}" class="band"/>`;
  });
  const xl = pts.map(p => `<text x="${xs(p).toFixed(1)}" y="${H-mb+15}" text-anchor="middle" class="xl${p.v==null?" dim":""}">${p.ex.dia}</text><text x="${xs(p).toFixed(1)}" y="${H-mb+28}" text-anchor="middle" class="xl2${p.v==null?" dim":""}">${p.v==null?p.ex.horaPadrao:horaDe(p)}</text>`).join("");
  const num = pts.filter(p => typeof p.v === "number");
  const path = num.length > 1 ? `<path class="chart-line" d="${num.map((p,k)=>`${k?"L":"M"}${xs(p).toFixed(1)} ${ys(p.v).toFixed(1)}`).join(" ")}"/>` : "";
  const dots = num.map(p => { const s = status(p.v, p.ref); return `<circle cx="${xs(p).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="4.5" class="dot ${s}"/><text x="${xs(p).toFixed(1)}" y="${(ys(p.v)-9).toFixed(1)}" text-anchor="middle" class="vl ${s}">${fmt(p.v, p.dec)}</text>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Evolução de ${an.nome}"><line x1="${ml}" x2="${W-mr}" y1="${H-mb}" y2="${H-mb}" class="grid"/>${grid}${band}${path}${dots}${xl}</svg>`;
}
function detailHtml(an, pts){
  const avail = pts.filter(p => p.v != null);
  const list = avail.map(p => {
    const s = status(p.v, p.ref);
    const extra = [p.pct != null ? `(${pctTxt(p.pct)})` : null, p.nota].filter(Boolean).join(", ");
    return `<li><span class="dl-d">${p.ex.dia} ${horaDe(p)}</span><span><span class="v ${s} s${sev(p.v,p.ref)}">${fmt(p.v, p.dec)}</span>${an.unidade ? ` <span style="color:var(--text-2)">${an.unidade}</span>` : ""}${extra ? ` <span style="color:var(--text-3)">${extra}</span>` : ""}</span><span class="dl-l">${p.ex.lab}, ${p.ex.local}</span><span class="dl-r">Ref. ${refTexto(p.ref, an, true, p.dec)}</span></li>`;
  }).join("");
  const chart = avail.some(p => typeof p.v === "number") ? chartBig(an, pts) : "";
  return `<div class="detail-in">${chart ? `<div>${chart}</div>` : ""}<ul class="dl">${list}</ul></div>`;
}
function rowHtml(an){
  const pts = pontos(an);
  const anyAlt = pts.some(p => ABN(status(p.v, p.ref)));
  const cells = pts.map(p => `<td class="c-v${p.ex.id === LAST ? " cur" : ""}">${cellHtml(an, p)}</td>`).join("");
  const lastP = [...pts].reverse().find(p => p.v != null);
  const lastRef = lastP ? lastP.ref : an.ref, lastDec = lastP ? lastP.dec : an.dec;
  const refsDiffer = pts.filter(p => p.v != null).some(p => JSON.stringify(p.ref) !== JSON.stringify(lastRef));
  return `<tr class="row${anyAlt ? " alt" : ""}" data-id="${an.id}" tabindex="0">
    <td class="c-an"><span class="an-nome">${an.nome}</span>${an.unidade ? `<span class="an-un">${an.unidade}</span>` : ""}</td>
    ${cells}
    <td class="c-t">${sparkline(an, pts)}</td>
    <td class="c-r">${refTexto(lastRef, an, false, lastDec)}${refsDiffer ? ` <span class="refchg" title="A referência mudou entre coletas (laboratório diferente); veja o detalhe.">*</span>` : ""}</td>
  </tr>
  <tr class="detail" data-for="${an.id}"><td colspan="${EXAMES.length + 3}">${detailHtml(an, pts)}</td></tr>`;
}
function alertas(){
  const out = [];
  PAINEIS.forEach(pn => pn.itens.forEach(an => {
    const avail = pontos(an).filter(p => p.v != null); if (!avail.length) return;
    const last = avail[avail.length-1], s = status(last.v, last.ref);
    if (!ABN(s)) return;
    let run = 0; for (let i = avail.length-1; i >= 0 && ABN(status(avail[i].v, avail[i].ref)); i--) run++;
    out.push({an, last, s, run, d: dist(last.v, last.ref), isLatest: last.ex.id === LAST});
  }));
  out.sort((a, b) => (b.isLatest - a.isLatest) || (b.d - a.d));
  return out;
}
function contagemAlteradosPorExame(){
  const c = {}; EXAMES.forEach(ex => c[ex.id] = 0);
  PAINEIS.forEach(pn => pn.itens.forEach(an => EXAMES.forEach(ex => { const p = ponto(an, ex.id); if (ABN(status(p.v, p.ref))) c[ex.id]++; })));
  return c;
}

function render(){
  const labs = [...new Set(EXAMES.map(e => e.lab))];
  document.getElementById("pac-nome").textContent = PACIENTE.nome;

  const al = alertas();
  document.getElementById("alertas").innerHTML = al.length ? al.map(a =>
    `<button type="button" class="chip ${a.s} s${sev(a.last.v, a.last.ref)}" data-goto="${a.an.id}">${a.an.nome} <b>${fmt(a.last.v, a.last.dec)}</b>${a.s === "low" ? "↓" : a.s === "high" ? "↑" : ""}${a.run > 1 ? `<span class="cs">×${a.run}</span>` : ""}${a.isLatest ? "" : `<span class="cs">${a.last.ex.dia}</span>`}</button>`
  ).join("") : `<span class="empty">Nenhum resultado fora da referência.</span>`;

  const cont = contagemAlteradosPorExame();
  const head = `<thead><tr>
    <th class="c-an">Analito</th>
    ${EXAMES.map(ex => `<th class="${ex.id === LAST ? "cur" : ""}">${ex.dia}<span class="h2">${ex.hora}</span><span class="h2">${ex.lab}</span><span class="h2">${cont[ex.id]} alterado${cont[ex.id] === 1 ? "" : "s"}</span></th>`).join("")}
    <th class="c-t">Tendência</th>
    <th class="c-r">Referência<span class="h2">da última coleta</span></th>
  </tr></thead>`;

  document.getElementById("paineis").innerHTML = PAINEIS.map(pn => {
    const rows = pn.itens.map(rowHtml).join("");
    const noAlt = !pn.itens.some(an => pontos(an).some(p => ABN(status(p.v, p.ref))));
    const titulo = pn.recolhido !== undefined
      ? `<button type="button" class="ptoggle" aria-expanded="${!pn.recolhido}">${pn.nome}${pn.meta ? `<span class="pmeta">${pn.meta}</span>` : ""}</button>`
      : pn.nome;
    return `<section class="panel${noAlt ? " no-alt" : ""}${pn.recolhido ? " collapsed" : ""}">
      <h2>${titulo}</h2>${pn.nota ? `<p class="nota">${pn.nota}</p>` : `<p class="nota"></p>`}
      <div class="tbl-wrap"><table class="flow">${head}<tbody>${rows}</tbody></table></div>
    </section>`;
  }).join("");

  document.getElementById("rodape").innerHTML =
    `Transcrito dos laudos: ${labs.join(" e ")}, coletas de ${EXAMES.map(e => e.dia).join(", ")}/2026. Confira no laudo original antes de decidir. ` +
    `Cada valor é comparado com a referência impressa no próprio laudo daquela coleta; como os laboratórios usam faixas diferentes, a coluna Referência mostra a da última coleta e o asterisco marca linhas em que ela mudou. ` +
    `Na coleta de 29/09, exames de bioquímica foram colhidos às 06:23 e os demais às 09:58; a PCR foi dosada por método ultrassensível, mesmo corte de 5 mg/L. ` +
    `Toque em uma linha para ver o gráfico em escala de tempo real e todos os resultados.`;
}

function toggleRow(tr, force){
  const det = tr.nextElementSibling;
  const open = force != null ? force : !tr.classList.contains("open");
  tr.classList.toggle("open", open); det.classList.toggle("open", open);
}
document.addEventListener("click", e => {
  const pt = e.target.closest(".ptoggle");
  if (pt) { const sec = pt.closest(".panel"); const c = sec.classList.toggle("collapsed"); pt.setAttribute("aria-expanded", String(!c)); return; }
  const chip = e.target.closest("[data-goto]");
  if (chip) {
    const tr = document.querySelector(`tr.row[data-id="${chip.dataset.goto}"]`);
    if (!tr) return;
    document.getElementById("only-alt").checked = false; document.getElementById("paineis").classList.remove("only-alt");
    tr.closest(".panel").classList.remove("collapsed");
    toggleRow(tr, true); tr.scrollIntoView({block:"center", behavior:"smooth"}); tr.focus({preventScroll:true});
    return;
  }
  const tr = e.target.closest("tr.row"); if (tr) toggleRow(tr);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr.row")) { e.preventDefault(); toggleRow(e.target); }
});
document.getElementById("only-alt").addEventListener("change", e => document.getElementById("paineis").classList.toggle("only-alt", e.target.checked));
document.getElementById("exp-all").addEventListener("click", e => {
  const rows = [...document.querySelectorAll("tr.row")];
  const anyClosed = rows.some(r => !r.classList.contains("open"));
  rows.forEach(r => toggleRow(r, anyClosed));
  e.target.textContent = anyClosed ? "Recolher gráficos" : "Expandir gráficos";
});
render();
</script>
</body>
</html>
